<!-- 活动栏图标: 单色轮廓, 用 currentColor 跟随主题。刻意不纳入 scripts/icon-spec.mjs
     的生成体系 —— 那套逻辑产出的是市场用的彩色品牌图标, 与这里的单色轮廓无关。 -->
