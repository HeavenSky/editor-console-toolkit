     stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- 主机/端口面板 -->
  <rect x="3" y="8" width="18" height="11" rx="2" />
  <!-- 三个端口插孔 -->
  <path d="M7 13v2" />
  <path d="M12 13v2" />
  <path d="M17 13v2" />
  <!-- 两条接入线 -->
  <path d="M8 8V5" />
  <path d="M16 8V5" />
</svg>
