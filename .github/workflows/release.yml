name: Release

# 打 v* 标签即发布: 校验 -> 打包 vsix -> 创建 GitHub Release 并附带 vsix.
# 手动触发用于补发某个已存在的版本(不重新打标签).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'package.json 中的版本号, 例如 0.0.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      vsix: ${{ steps.version.outputs.vsix }}
      has_vsce_pat: ${{ steps.secrets.outputs.has_vsce_pat }}
      has_ovsx_pat: ${{ steps.secrets.outputs.has_ovsx_pat }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 标签与 package.json 版本必须一致, 否则产物名与 Release 名会错位.
      - name: Resolve and verify version
        id: version
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            input_version="${{ github.event.inputs.version }}"
          else
            input_version="${GITHUB_REF_NAME#v}"
          fi
          if [ "$pkg_version" != "$input_version" ]; then
            echo "版本不一致: package.json=$pkg_version, 触发版本=$input_version" >&2
            exit 1
          fi
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          echo "vsix=editor-console-toolkit-$pkg_version.vsix" >> "$GITHUB_OUTPUT"

      # 本项目没有自动化测试, 类型检查是唯一的自动质量门, 因此必须在打包前独立跑一次.
      - name: Typecheck
        run: npm run typecheck

      # 清单一致性: 两个 package.nls 的 key 集必须相同, 且与清单里用到的 %...% 占位符一一对应;
      # 运行时 l10n 源串必须与中文 bundle 的 key 一一对应. 这两项漏了不会让构建失败, 只会静默丢文案.
      - name: Verify localization
        run: |
          node -e "
          const fs = require('fs');
          const en = Object.keys(require('./package.nls.json')).sort();
          const zh = Object.keys(require('./package.nls.zh-cn.json')).sort();
          const used = [...new Set([...JSON.stringify(require('./package.json')).matchAll(/%([a-zA-Z.]+)%/g)].map(m => m[1]))].sort();
          const bundle = Object.keys(require('./l10n/bundle.l10n.zh-cn.json')).sort();
          const src = fs.readFileSync('src/commands/runner.ts', 'utf8');
          const runtime = [...new Set([...src.matchAll(/vscode\.l10n\.t\('([^']+)'\)/g)].map(m => m[1]))].sort();
          const fail = (msg) => { console.error('::error::' + msg); process.exitCode = 1; };
          if (JSON.stringify(en) !== JSON.stringify(zh)) fail('package.nls 中英 key 集不一致');
          if (JSON.stringify(en) !== JSON.stringify(used)) fail('package.nls key 与清单占位符不匹配');
          if (JSON.stringify(bundle) !== JSON.stringify(runtime)) fail('运行时 l10n 源串与中文 bundle 不匹配');
          if (!process.exitCode) console.log('localization ok:', en.length, 'nls keys,', runtime.length, 'runtime strings');
          "

      # 静态负向检查: 保证产物里没有常驻 UI, 后台监听, 磁盘读取, 网络与遥测.
      - name: Verify no background or network code
        run: |
          if grep -nE 'createStatusBarItem|createTreeView|registerTreeDataProvider|registerWebviewViewProvider|onDidChangeTextDocument|onDidChangeActiveTextEditor|onDidChangeConfiguration|setInterval|setTimeout|readFileSync|axios|telemetry' -r src; then
            echo "::error::src 中出现了被禁止的 API" >&2
            exit 1
          fi
          node -e "
          const p = require('./package.json');
          const bad = [];
          for (const k of ['keybindings', 'views', 'viewsContainers', 'menus']) if (p.contributes[k]) bad.push('contributes.' + k);
          if (p.activationEvents) bad.push('activationEvents');
          if (p.extensionDependencies) bad.push('extensionDependencies');
          if (Object.keys(p.dependencies || {}).length) bad.push('非空 dependencies');
          if ((p.contributes.commands || []).some(c => c.enablement)) bad.push('commands[].enablement');
          if (bad.length) { console.error('::error::package.json 存在禁止项: ' + bad.join(', ')); process.exit(1); }
          console.log('manifest ok');
          "

      # vsce package 会触发 vscode:prepublish 做生产构建, 无需另外 compile.
      - name: Package extension
        run: npx --no-install vsce package --out "${{ steps.version.outputs.vsix }}"

      # 取 CHANGELOG 中与本版本对应的小节作为 Release 说明; 缺失时只告警, 不阻断发布.
      - name: Extract release notes
        run: |
          awk -v ver="## ${{ steps.version.outputs.version }}" '
            $0 == ver { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::warning::CHANGELOG.md 中未找到 \"## ${{ steps.version.outputs.version }}\" 小节, Release 说明为空"
          fi
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.version.outputs.vsix }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.vsix }}
          path: ${{ steps.version.outputs.vsix }}

      # secrets 上下文在 job 级 if 中不可用, 因此在这里转成 job output 供下游判断.
      - name: Check marketplace credentials
        id: secrets
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          [ -n "$VSCE_PAT" ] && echo "has_vsce_pat=true" >> "$GITHUB_OUTPUT" || echo "has_vsce_pat=false" >> "$GITHUB_OUTPUT"
          [ -n "$OVSX_PAT" ] && echo "has_ovsx_pat=true" >> "$GITHUB_OUTPUT" || echo "has_ovsx_pat=false" >> "$GITHUB_OUTPUT"

  # 仅在仓库配置了 VSCE_PAT 后运行; 未配置时跳过, 只发 GitHub Release.
  # 发布 release job 已校验并附到 Release 的那个 vsix(--packagePath), 不重新构建,
  # 保证市场上的产物与 Release 附件逐字节一致.
  marketplace:
    needs: release
    if: needs.release.outputs.has_vsce_pat == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # 只为拿到 vsce 可执行文件; 打包已在 release job 完成.
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release.outputs.vsix }}

      - name: Publish to VS Code Marketplace
        run: npx --no-install vsce publish --packagePath "${{ needs.release.outputs.vsix }}"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  # Open VSX(VSCodium / Cursor / Windsurf 等非官方发行版的市场), 同样按 secret 存在与否开关.
  open-vsx:
    needs: release
    if: needs.release.outputs.has_ovsx_pat == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release.outputs.vsix }}

      - name: Publish to Open VSX
        run: npx --yes ovsx publish "${{ needs.release.outputs.vsix }}"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
